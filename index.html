<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090604"><title>RetroTape Web</title><link rel="stylesheet" href="styles.css?v=photo1"></head><body>
<main class="stage"><img class="scene" src="retrotape-scene.jpg" alt="RetroTape Web"><div id="status" class="status">Escolha uma fita</div>
